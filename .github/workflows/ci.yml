name: CI

# Continuous feedback on three things that can each break independently:
#   1. the Python golden models (pure software, no HDL toolchain),
#   2. simulation of the RTL against them (GHDL and NVC),
#   3. *synthesis* of the RTL (Yosys + GHDL), with resource guard rails.
#
# (3) is not redundant with (2). A design can be perfectly green in simulation
# and still be unsynthesizable, or silently blow up in area:
#   - variable loop ranges and dynamically-bounded slices simulate fine, then
#     crash GHDL's synthesis backend outright;
#   - a combinational memory read simulates fine, then infers thousands of
#     distributed-RAM cells instead of a block RAM.
# Both have already happened in this repo, which is why the netlist job exists
# and why every synthesizable entity carries BuildResultCheckers.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model:
    name: Golden model (pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        # The model is deliberately pure-stdlib (no numpy), so the
        # reference implementation the RTL is checked against has no
        # third-party numerics in its trust path.
        run: python -m pip install --upgrade pip pytest

      - name: Run golden-model test suite
        # The RTL is verified bit-exactly against this model, so a broken
        # model silently invalidates every simulation result downstream.
        #
        # Paths are listed explicitly rather than letting pytest discover from
        # the repo root, which would descend into the hdl-modules submodule and
        # try to collect its suite too.
        run: >
          python -m pytest -q
          modules/cnn_accel/test_cnn_accel_model.py

  simulate:
    name: Simulate (${{ matrix.simulator }})
    runs-on: ubuntu-24.04
    container:
      # Pinned, never a floating tag: the toolchain version is part of the
      # reproducibility contract.
      image: ru551n/hdl-docker:1.3.0
      # The image's final stage ends with `USER hdl`, so anything that needs
      # apt-get (installing git/python below) must run as root.
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        include:
          - simulator: ghdl
            # GHDL is the reference simulator: everything must pass.
            patterns: "*"
          - simulator: nvc
            # Second simulator, same suite: a VHDL-2008 construct that only
            # GHDL accepts is a portability defect worth catching here.
            patterns: "*"
    steps:
      # Must precede actions/checkout: the image is deliberately minimal and
      # ships neither git nor python, and checkout needs git for the
      # hdl-modules submodule (and pip needs it for the git-pinned
      # requirements).
      #
      # python3-dev (not just python3/python3-venv): every cnn_accel testbench
      # and the flash_model verification component use VUnit's Python FFI
      # (python_execute/python_call, add_vhdl_builtins(python=True), see
      # shared/Vunit.md's "Python FFI" section). The simulator embeds a Python
      # interpreter at run time, which needs the bare, unversioned
      # libpythonX.Y.so symlink -- Ubuntu ships that only in the *-dev package,
      # so python3/python3-venv alone give the venv a working interpreter but
      # not that symlink -- plus Python.h, since the bridge compiles its small
      # shared library the FIRST TIME IT RUNS rather than at install time.
      # Without either, simulation fails ("Failed to find the shared Python
      # library" / "needs a C compiler ... Install one or set the CC
      # environment variable") even though everything imports and runs fine
      # outside the simulator.
      #
      # `python3-dev`, not `python3.12-dev`, and that is load-bearing: the
      # bridge must build against the interpreter that actually runs, and the
      # venv below is created by `python3 -m venv`, so its INCLUDEPY resolves
      # to the SYSTEM interpreter's headers. `python3-dev` tracks the same
      # distro default as `python3`, so the two match by construction and keep
      # matching when the base image moves to a new Ubuntu.
      #
      # The C compiler is no longer installed here: hdl-docker >= 1.3.0 ships
      # gcc + libc6-dev, because compiling at run time is a property of the
      # tooling rather than of this project. (That also replaces
      # build-essential, which pulled in g++/make/dpkg-dev that nothing here
      # used.)
      - name: Install git and Python
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git python3 python3-venv python3-dev
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Trust the workspace
        # The container UID differs from the checkout's owner, which
        # otherwise trips git's "dubious ownership" guard.
        run: git config --global --add safe.directory '*'

      - name: Install Python dependencies
        # Commit-pinned in requirements.txt rather than taken from PyPI, so
        # the exact VUnit and tsfpga revisions stay recorded in this repo's
        # history (they used to be submodules). VUnit is ru551n's fork,
        # because that is what the testbenches and vunit-mcp are developed
        # against.
        run: |
          python3 -m venv /opt/venv
          /opt/venv/bin/pip install --upgrade pip
          /opt/venv/bin/pip install -r requirements.txt

      # Fail here, with a readable message, rather than inside GHDL's
      # elaboration output. The bridge builds its shared library lazily, so a
      # missing header or compiler otherwise surfaces as every python_call
      # testbench failing to elaborate -- which looks like an HDL problem and
      # is not one.
      - name: Check the Python bridge can be built
        run: |
          /opt/venv/bin/python - <<'PY'
          import shutil, sys, sysconfig
          from pathlib import Path

          include = Path(sysconfig.get_paths()["include"])
          header = include / "Python.h"
          compiler = shutil.which("cc") or shutil.which("gcc") or shutil.which("clang")

          problems = []
          if not header.exists():
              problems.append(f"missing {header} -- install python3-dev")
          if not sysconfig.get_config_var("Py_ENABLE_SHARED"):
              problems.append("this CPython is not built shared; the bridge needs libpython")
          if sysconfig.get_config_var("Py_GIL_DISABLED"):
              problems.append("free-threaded CPython is unsupported by the bridge")
          if compiler is None:
              problems.append("no C compiler on PATH -- the image should ship gcc")

          if problems:
              sys.exit("Python bridge prerequisites missing:\n  " + "\n  ".join(problems))

          print(f"bridge prerequisites OK: Python {sysconfig.get_python_version()}, "
                f"headers {include}, compiler {compiler}")
          PY

      - name: Run VUnit regression
        env:
          VUNIT_SIMULATOR: ${{ matrix.simulator }}
        run: /opt/venv/bin/python run.py --num-threads 4 ${{ matrix.patterns }}

  synthesize:
    name: Synthesize (Yosys + GHDL, Artix-7)
    runs-on: ubuntu-24.04
    container:
      image: ru551n/hdl-docker:1.3.0
      options: --user root
    env:
      # Where hdl-docker installs the ghdl-yosys-plugin. Consumed by
      # ghdl_yosys_env.resolve_ghdl_plugin_path(), whose fallback is this
      # machine's local install path and therefore wrong inside the image.
      GHDL_YOSYS_PLUGIN: /opt/yosys/share/yosys/plugins/ghdl.so
    steps:
      - name: Install git and Python
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git python3 python3-venv
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Trust the workspace
        run: git config --global --add safe.directory '*'

      - name: Install Python dependencies
        # requirements-synth.txt, not requirements.txt: the pinned ru551n
        # tsfpga carries the Yosys netlist-build support
        # (`tsfpga.yosys.project`) that upstream has not released, but it must
        # run against *released* VUnit 4.7.1 rather than the 5.0.0.dev fork
        # the simulate jobs use. See the file's own comment for why.
        run: |
          python3 -m venv /opt/venv
          /opt/venv/bin/pip install --upgrade pip
          /opt/venv/bin/pip install -r requirements-synth.txt

      - name: Check the toolchain is wired up
        # Fails loudly and early if a future image drops or moves the plugin,
        # instead of surfacing as a confusing per-project synthesis error.
        run: |
          test -f "$GHDL_YOSYS_PLUGIN"
          ghdl --version
          yosys -m ghdl -p 'help ghdl' > /dev/null

      - name: Build all netlist projects
        # Every synthesizable entity has BuildResultCheckers attached (see
        # each module's `get_build_projects()`), so this fails not only on a
        # synthesis error but also when an entity's LUT/FF/BRAM/DSP count
        # grows past its recorded baseline.
        #
        # Serialized deliberately. With parallel builds, VUnit 4.7.1's test
        # runner threads race on a stdout that the parent has already closed
        # ("ValueError: I/O operation on closed file"), which kills the
        # *create* phase of whichever projects those threads were handling.
        # They then fail the build phase with a misleading 'Project "x" does
        # not exist ... Call create before build'. One thread, no race.
        run: /opt/venv/bin/python build_fpga.py --netlist-builds --num-parallel-builds 1

      - name: Upload synthesis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netlist-utilization-reports
          path: |
            generated/projects/*/*_utilization.txt
            generated/projects/*/output.txt
          if-no-files-found: warn
