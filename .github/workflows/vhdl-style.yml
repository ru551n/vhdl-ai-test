name: VHDL style

# Checks the VHDL in modules/ against the VUnit-derived style in vsg.yaml with vsg-rs
# (https://github.com/ru551n/vsg-rs). Violations appear as annotations on the changed lines,
# in the job summary and as code scanning alerts (Security tab). To fix them locally:
#
#   pip install vsg-rs
#   vsg-rs -c vsg.yaml --recursive modules --fix

on:
  push:
    branches: [main, "style/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vsg:
    name: vsg-rs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Code scanning upload.
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - uses: ru551n/vsg-rs@v0.9.2
        with:
          args: -c vsg.yaml --recursive modules
          sarif-upload: true
