[pytest]
# Keep collection inside this project. Without this, a bare `pytest` from the
# repo root descends into the hdl-modules submodule and runs *its* suite
# (including its own ruff lint tests, which fail against this repo's config),
# and into any local source clone of vunit/tsfpga a developer has checked out
# alongside. CI lists its paths explicitly for the same reason.
norecursedirs =
    hdl-modules
    vunit
    tsfpga
    generated
    vunit_out
    tsfpga_mcp_out
    .venv
    .venv-synth
    .git
