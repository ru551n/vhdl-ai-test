# Maki project MCP configuration for vhdl-ai-test.
#
# Adapted from ~/git/vhdl-skills/integrations/maki/mcp.toml, pointed at the
# already-cloned-and-synced local checkouts of each MCP server (uv run
# --directory <repo>) instead of `uvx --from git+https://...`, so servers
# start from a local, already-`uv sync`'d venv without a GitHub fetch on
# every launch. Swap back to the git+https form if these local checkouts
# move/disappear.
#
# `timeout` is the per-tool-call timeout in milliseconds (Maki allows
# 1..=300000).

defer_tools = 10

[mcp.corvidex-mcp]
command = ["uv", "--directory", "/home/sebbe/corvidex-mcp", "run", "corvidex-mcp"]
timeout = 300000
enabled = true

[mcp.vunit-mcp]
command = ["uv", "--directory", "/home/sebbe/git/vunit-mcp", "run", "vunit-mcp"]
# Project under test (this repo), not the vunit-mcp server's own checkout.
# VUNIT_MCP_PYTHON: this project's run.py imports tsfpga.module.get_modules(),
# which is not installed in vunit-mcp's own server venv -- point at the
# interpreter that actually has both tsfpga and vunit-hdl (see mcp_issues_log.md).
environment = { VUNIT_MCP_PROJECT_DIR = "/home/sebbe/git/vhdl-ai-test", VUNIT_MCP_TIMEOUT = "240", VUNIT_MCP_PYTHON = "/usr/bin/python3" }
timeout = 300000
enabled = true

[mcp.peeper-mcp]
command = ["uv", "--directory", "/home/sebbe/git/peeper-mcp", "run", "peeper-mcp"]
timeout = 300000
enabled = true

[mcp.tsfpga-mcp]
command = ["uv", "--directory", "/home/sebbe/git/tsfpga-mcp", "run", "tsfpga-mcp"]
# Local GHDL/yosys toolchain locations (see ~sebbe memory tsfpga_mcp.md).
# Project mode (tsfpga_project_list_builds/tsfpga_project_build) drives this
# repo's own build_fpga.py. TSFPGA_MCP_PROJECT_PYTHON must be an interpreter
# with tsfpga's Yosys/GHDL netlist-build support (tsfpga.yosys.project) plus
# vunit_hdl -- not yet in the stable tsfpga release this project's
# run.py/VUnit flow uses (see VUNIT_MCP_PYTHON below).
# 2026-09-06: this used to point at tsfpga-mcp's own venv, but that venv no
# longer has tsfpga installed at all (`import tsfpga` -> ModuleNotFoundError,
# so every tsfpga_project_build failed with "No module named
# tsfpga.build_project_list"). It was then pointed at this checkout's .venv,
# which at the time happened to carry the synthesis pins despite its name.
#
# 2026-09-07: the trap that previous note warned about has now sprung, and
# this pointer is fixed accordingly. A dedicated synthesis venv exists, and
# .venv has been rebuilt from requirements.txt -- so .venv now carries
# vunit_hdl 5.0.0.dev12 (the fork, for run.py), which is precisely the
# combination requirements-synth.txt says cannot drive build_fpga.py.
# This now points at the synthesis venv instead.
#
# NOTE the spelling: the directory is `venv-synth`, with no leading dot,
# while AGENTS.md and requirements-synth.txt both write `.venv-synth`. The
# real path on this machine wins; both spellings are gitignored. Verified
# 2026-09-07 by running all six Yosys netlist builds green through it.
environment = { GHDL_YOSYS_PLUGIN = "/home/sebbe/git/ghdl-yosys-plugin/ghdl.so", TSFPGA_MCP_PROJECT_DIR = "/home/sebbe/git/vhdl-ai-test", TSFPGA_MCP_BUILD_SCRIPT = "build_fpga.py", TSFPGA_MCP_PROJECT_PYTHON = "/home/sebbe/git/vhdl-ai-test/venv-synth/bin/python3", TSFPGA_MCP_VIVADO = "/opt/xilinx/2026.1/Vivado/bin/vivado" }
timeout = 300000
enabled = true
